# Plugin metadata
pluginGroup=com.perryweather.wdio
pluginName=WebdriverIO
pluginRepositoryUrl=https://github.com/avenstewart/jetbrains-wdio-plugin

# SemVer format -> https://semver.org
pluginVersion=0.1.0

# Build against the lowest supported version per JetBrains guidance.
# https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild=251

# Platform target for development and the sandbox IDE.
# WebStorm bundles JavaScript, NodeJS, and Gherkin; IDEA Ultimate is a superset
# at runtime but does not bundle Gherkin, so we develop against WebStorm.
platformType=WS
platformVersion=2025.1

# Opt-out flag for bundling Kotlin standard library.
# https://kotlinlang.org/docs/gradle-configure-project.html#dependency-on-the-standard-library
kotlin.stdlib.default.dependency=false
kotlin.code.style=official
